<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../header_log.js" defer></script>
    <script src="../utils.js" defer></script>
    <script src="editar_perfil.js" defer></script>
    <link rel="stylesheet" href="editar_perfil.css">
    <title>Editando Perfil...</title>
    <!--FONTS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <main>
        <h1 class="lora-font">Editá tu Perfil</h1>
        <hr>

        <form id="avUs">
            <div class="cat">
                <label class="lora-font" for="avatar">Foto de Perfil</label>
                <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2c/Default_pfp.svg/250px-Default_pfp.svg.png?utm_source=es.wikipedia.org&utm_campaign=index&utm_content=thumbnail"
                    alt="avatar_actual">
                <input type="text" id="avatar" name="avatar" placeholder="URL de la nueva imagen">
            </div>
            <hr class="divisor">
            <div class="cat">
                <label class="lora-font" for="username">Nombre de Usuario</label>
                <input class="text-input" type="text" id="username" name="username" value="username_actual">
            </div>
            <hr class="divisor">
            <input class="boton" type="submit" value="Guardar Cambios">
        </form>
    </main>
</body>

</html>
