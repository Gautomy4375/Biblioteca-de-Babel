<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="home.css">
    <title>Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--FONTS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>
<body>
    <section class="barra">
        <img class="logo" src="../logo.svg" alt="">
        <div class="nombre lora-font">Babel</div>
        <div class="buscador-container">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ9wiYOfiSl6tCHwpDPn72D9SZys0KGLXcgtrD5GIAWJQ&s=10" alt="Icono" class="lupita">
            <input class="buscador plus-jakarta-sans" type="text" placeholder="Buscar...">
        </div>
        <div class="barralinks">
            <nav class="menu plus-jakarta-sans">
                <button><a class="botonmenu plus-jakarta-sans" href="#">Libros</a></button>
                <button><a class="botonmenu plus-jakarta-sans" href="#">Listas</a></button>
                <button><a class="botonmenu plus-jakarta-sans" href="#">Sign In</a></button>
            </nav>
        </div>
    </section>

    <section class="foto">
        <section class="citaeinscribirse container" id="animatedContainer">
            <div class="cita box exit">
                <h3 class="lora-font">"Siempre imagine que el paraíso seria una especie de biblioteca"</h3>
                <p class="lora-font">-Jorge Luis Borges</p>
            </div>
            <div class="inscridesc">

                <div class="descripcion box enter lora-font">
                    Llevá un registro de los libros que leiste.<br>Guardá las que querés leer.<br>Decile a tus amigos cual es tu gusto
                </div>
                <div class="inscribirse box enter">
                    <input class="mailfirstinput plus-jakarta-sans" type="text" placeholder="Escribí tu Mail">
                    <button class="plus-jakarta-sans">¡Empezá!</button>
                </div>
            </div>
        </section>
    </section>

    <!--ANIMACIONES-->
    <script>
        const container = document.getElementById('animatedContainer');

        window.addEventListener('scroll', () => {
            // Se activa cuando el usuario scrolea más de 30px
            if (window.scrollY > 200) {
                container.classList.add('active');
            }
        });
    </script>
</body>
</html>
