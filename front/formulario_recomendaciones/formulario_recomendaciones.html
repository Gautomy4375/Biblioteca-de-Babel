<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="formulario_recomendaciones.css">
    <script src="../utils.js"></script>
    <script src="../header_log.js"></script>
    <!--FONTS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">

<body>
    <main class="todo">
        <article class="arriba">
            <div class="inputytitu">
                <h1 class="lora-font">¡Dejanos Conocerte!</h1>
                <h2 class="lora-font">Contanos cuales son tus 5 libros favoritos:</h2>
                <div class="container-input">
                    <input class="lora-font" type="text" id="searchInput">
                    <div id="resultsList" class="results-dropdown"></div>
                </div>
            </div>
        </article>
        <article class="tapas" id="tapasContainer"></article>
    </main>

    <!-- #region popup bienvenida -->
    <article id="bienvenidaOverlay" class="bienvenida hidden">
        <section class="bienvenida-card">
            <h1 class="lora-font">¡Bienvenido a Babel!</h1>
            <hr width="100%">
            <p class="lora-font">Ya guardamos tus favoritos. ¡Comenzá!</p>
            <button class="lora-font btnSend" id="btnEmpezar">Empezar</button>
        </section>
    </article>
    <!-- #endregion -->

    <script src="formulario_recomendaciones.js"></script>
</body>

</html>
